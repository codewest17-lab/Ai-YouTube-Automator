name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab, or `gh workflow run`

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        run: npm ci

      - name: Generate the android/ platform project
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Merge native plugin/service/worker code
        run: bash scripts/apply-native-android.sh

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ajet-youtube-uploader-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # Optional: signed release APK. Only runs if you've added the four
  # secrets below in GitHub → Settings → Secrets and variables → Actions.
  # Leave them unset and this job is skipped — the debug build above is
  # enough to sideload on your own phone.
  #   RELEASE_KEYSTORE_BASE64   (base64 of your .jks/.keystore file)
  #   RELEASE_KEYSTORE_PASSWORD
  #   RELEASE_KEY_ALIAS
  #   RELEASE_KEY_PASSWORD
  # ---------------------------------------------------------------------
  build-release:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' }}
    env:
      HAVE_SIGNING: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout
        if: env.HAVE_SIGNING == 'true'
        uses: actions/checkout@v4

      - name: Set up Node
        if: env.HAVE_SIGNING == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up JDK 17
        if: env.HAVE_SIGNING == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK
        if: env.HAVE_SIGNING == 'true'
        uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        if: env.HAVE_SIGNING == 'true'
        run: npm ci

      - name: Generate the android/ platform project
        if: env.HAVE_SIGNING == 'true'
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Merge native plugin/service/worker code
        if: env.HAVE_SIGNING == 'true'
        run: bash scripts/apply-native-android.sh

      - name: Decode keystore
        if: env.HAVE_SIGNING == 'true'
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Build signed release APK
        if: env.HAVE_SIGNING == 'true'
        working-directory: android
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=release.keystore \
            -Pandroid.injected.signing.store.password="$RELEASE_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$RELEASE_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$RELEASE_KEY_PASSWORD"

      - name: Upload signed APK
        if: env.HAVE_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ajet-youtube-uploader-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
